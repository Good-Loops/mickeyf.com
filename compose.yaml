name: mickeyf-local

services:
  cloud-sql-proxy:
    image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.23.0@sha256:54e23cad9aeeedbf88ab75f993146631b878035f702b31c51885a932e0c7286c
    user: "65532:65532"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
    stop_grace_period: 30s
    command:
      - "--address=0.0.0.0"
      - "--port=3306"
      - "${CLOUD_SQL_CONNECTION_NAME:?Set CLOUD_SQL_CONNECTION_NAME in .env}"
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /secrets/application_default_credentials.json
    volumes:
      - type: bind
        source: "${GOOGLE_APPLICATION_CREDENTIALS_HOST:-${APPDATA:-}/gcloud/application_default_credentials.json}"
        target: /secrets/application_default_credentials.json
        read_only: true
    ports:
      - "127.0.0.1:3306:3306"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
