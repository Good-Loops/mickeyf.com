name: Docs (TypeDoc -> /docs)

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'docs-src/**'
      - 'scripts/clean-docs.mjs'
      - 'scripts/copy-doc-assets.mjs'
      - 'typedoc.merge.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-main
  cancel-in-progress: true

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      NPM_CONFIG_FUND: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
            backend/package-lock.json

      - name: Use project npm version
        run: npm install --global npm@11.6.2 --no-audit --no-fund

      - name: Install root deps
        run: npm ci

      - name: Install frontend deps
        run: npm --prefix frontend ci

      - name: Install backend deps
        run: npm --prefix backend ci

      - name: Build docs
        run: npm run docs

      - name: Upload generated docs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: generated-docs
          path: docs
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

  commit:
    name: Commit documentation
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download generated docs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: generated-docs
          path: ${{ runner.temp }}/generated-docs

      - name: Commit /docs if changed
        env:
          GENERATED_DOCS: ${{ runner.temp }}/generated-docs
        run: |
          set -euo pipefail

          test -f "$GENERATED_DOCS/index.html"
          git rm -r --ignore-unmatch -- docs
          mkdir --parents docs
          cp --archive "$GENERATED_DOCS"/. docs/
          git add --all -- docs

          if git diff --cached --quiet -- docs; then
            echo "No docs changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: update TypeDoc output [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
