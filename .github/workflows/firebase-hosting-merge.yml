          if not isinstance(release_time, str) or not re.fullmatch(
              r"[0-9]{4}-[0-9]{2}-[0-9]{2}T[^\n]+Z", release_time
          ):
              raise SystemExit("Latest release time is malformed.")
          version = release.get("version")
          if not isinstance(version, dict):
              raise SystemExit("Latest release version is malformed.")
          name = version.get("name")
          status = version.get("status")
          message = release.get("message")
