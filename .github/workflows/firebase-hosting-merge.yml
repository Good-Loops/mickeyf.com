      - name: Require enabled production Three Bosses submissions
        timeout-minutes: 2
        env:
          PRODUCTION_API_URL: https://mickeyf-org-j7yuum4tiq-uc.a.run.app
        run: |
          set -euo pipefail
          python3 - "$PRODUCTION_API_URL" <<'PY'
          import json
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request

          origin = sys.argv[1]
          parsed = urllib.parse.urlsplit(origin)
          if (
              parsed.scheme != "https"
              or parsed.username is not None
              or parsed.password is not None
              or parsed.port is not None
              or parsed.path not in ("", "/")
              or parsed.query
              or parsed.fragment
          ):
              raise SystemExit("Production API URL is not a canonical HTTPS origin.")

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          opener = urllib.request.build_opener(urllib.request.ProxyHandler({}), NoRedirect())

          def request(path, expected_status, payload=None):
              data = None if payload is None else json.dumps(payload, separators=(",", ":")).encode("ascii")
              headers = {
                  "Accept": "application/json",
                  "Accept-Encoding": "identity",
                  "User-Agent": "mickeyf-firebase-promotion-gate/1",
              }
              if data is not None:
                  headers["Content-Type"] = "application/json"
              req = urllib.request.Request(
                  origin + path,
                  data=data,
                  headers=headers,
                  method="POST" if data is not None else "GET",
              )
              try:
                  response = opener.open(req, timeout=30)
              except urllib.error.HTTPError as error:
                  response = error
              with response:
                  if response.status != expected_status:
                      raise SystemExit(f"{path} returned HTTP {response.status}; expected {expected_status}.")
                  if response.headers.get_content_type().lower() != "application/json":
                      raise SystemExit(f"{path} did not return JSON.")
                  if response.headers.get_all("Set-Cookie"):
                      raise SystemExit(f"{path} unexpectedly set a cookie.")
                  cache_directives = {
                      directive.strip().lower()
                      for value in response.headers.get_all("Cache-Control", [])
                      for directive in value.split(",")
                  }
                  if "no-store" not in cache_directives:
                      raise SystemExit(f"{path} did not return Cache-Control: no-store.")
                  body = response.read(64 * 1024 + 1)
                  if len(body) > 64 * 1024:
                      raise SystemExit(f"{path} exceeded the response body limit.")
              try:
                  return json.loads(body.decode("utf-8"))
              except (UnicodeError, json.JSONDecodeError) as error:
                  raise SystemExit(f"{path} returned malformed JSON.") from error

          catalog = request("/api/leaderboards", 200)
          if not isinstance(catalog, dict) or catalog.get("success") is not True:
              raise SystemExit("Production leaderboard catalog response is malformed.")
          games = catalog.get("games")
          if not isinstance(games, list):
              raise SystemExit("Production leaderboard catalog games are malformed.")
          three_bosses = [game for game in games if isinstance(game, dict) and game.get("gameId") == "three-bosses"]
          if len(three_bosses) != 1 or (
              three_bosses[0].get("rulesVersion") != 1
              or three_bosses[0].get("rankState") != "ranked"
              or three_bosses[0].get("submissionState") != "enabled"
          ):
              raise SystemExit("Production Three Bosses catalog entry is not ranked and enabled.")

          anonymous_ticket = request("/api/leaderboards/three-bosses/run-tickets", 401, {
              "contractVersion": 1,
              "rulesVersion": 1,
              "runId": "123e4567-e89b-42d3-a456-426614174000",
          })
          if anonymous_ticket != {
              "success": False,
              "contractVersion": 1,
              "error": "UNAUTHORIZED",
          }:
              raise SystemExit("Production Three Bosses anonymous run-ticket gate is not open.")

          anonymous = request("/api/leaderboards/three-bosses/runs", 401, {
              "contractVersion": 1,
              "rulesVersion": 1,
              "runId": "123e4567-e89b-42d3-a456-426614174000",
              "completionTimeMs": 60000,
              "runTicket": "anonymous-gate-probe",
          })
          if anonymous != {
              "success": False,
              "contractVersion": 1,
              "error": "UNAUTHORIZED",
          }:
              raise SystemExit("Production Three Bosses anonymous submission gate is not open.")

          print("Production Three Bosses ticket and submission gates are ranked, enabled, and write-safe.")
          PY

