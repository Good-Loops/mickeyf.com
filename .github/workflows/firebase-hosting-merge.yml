name: Deploy to Firebase Hosting on merge

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - 'firebase.json'
      - '.firebaserc'
      - '.github/workflows/firebase-hosting-merge.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: firebase-hosting-live
  cancel-in-progress: false

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      NPM_CONFIG_FUND: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: noted-reef-387021
          workload_identity_provider: projects/1012884798546/locations/global/workloadIdentityPools/github-actions-firebase/providers/github-mickeyf-com-main
          service_account: github-action-635373308@noted-reef-387021.iam.gserviceaccount.com

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Use project npm version
        run: npm install --global npm@11.6.2 --no-audit --no-fund

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Build the project
        run: npm run build
        working-directory: frontend
        env:
          VITE_PROD_API_URL: https://mickeyf-org-j7yuum4tiq-uc.a.run.app

      - name: Deploy to Firebase Hosting
        run: >-
          npm exec --yes --package=firebase-tools@15.27.0 --
          firebase deploy
          --only hosting
          --project noted-reef-387021
          --non-interactive

      - name: Notify Slack (result)
        if: always()
        continue-on-error: true
        env:
          DEPLOY_STATUS: ${{ job.status }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          set -euo pipefail

          if [[ -z "${SLACK_WEBHOOK_URL:-}" ]]; then
            echo "Slack notification skipped because no webhook is configured."
            exit 0
          fi

          if [[ "$DEPLOY_STATUS" == "success" ]]; then
            message="Frontend deployed to Firebase Hosting. Commit: ${GITHUB_SHA:0:7}"
          else
            message="Frontend deploy failed. Commit: ${GITHUB_SHA:0:7}. Check GitHub Actions logs."
          fi

          payload="$(jq -cn --arg text "$message" '{text: $text}')"
          curl --fail --silent --show-error --retry 3 --max-time 15 \
            --proto '=https' --tlsv1.2 \
            --request POST \
            --header 'Content-Type: application/json' \
            --data "$payload" \
            "$SLACK_WEBHOOK_URL"
