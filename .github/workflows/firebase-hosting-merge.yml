          if not isinstance(name, str) or not re.fullmatch(rf"sites/{site}/versions/[A-Za-z0-9_-]+", name):
              raise SystemExit("Latest release version name is malformed.")
          if not isinstance(status, str) or not isinstance(message, str) or "\n" in message:
              raise SystemExit("Latest release metadata is malformed.")
          print(name)
          print(status)
          print(message)
          print(release_type)
          print(release_name)
          PY
            )

            if [[ "${#latest[@]}" -ne 5 ]]; then
              echo "Could not parse the latest Firebase release." >&2
              exit 1
            fi
            if [[ "${latest[2]}" == "$DEPLOY_MARKER" ]]; then
