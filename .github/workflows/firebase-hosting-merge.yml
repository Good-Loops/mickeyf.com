            elif rollback_is_transient; then
              echo "Rollback response was ambiguous; checking live ownership before one bounded retry."
              still_owned_checks=0
              already_restored="false"
              for check in 1 2 3; do
                sleep 5
                mapfile -t rollback_state < <(read_live_state)
                if [[ "${#rollback_state[@]}" -ne 4 ]]; then
                  echo "Could not establish Firebase state after an ambiguous rollback response." >&2
                  exit 1
                fi
                if [[ "${rollback_state[0]}" == "$PREVIOUS_VERSION_NAME" ]]; then
                  if [[ "${rollback_state[1]}" == "$rollback_marker" ]]; then
                    rollback_release_name="${rollback_state[3]}"
                  else
                    echo "A separate release already restored the captured previous version; not overwriting it."
                    rollback_release_name=""
                  fi
                  already_restored="true"
                  break
                fi
                if [[ "${rollback_state[0]}" != "$PROMOTED_VERSION_NAME" || "${rollback_state[1]}" != "$DEPLOY_MARKER" || \
                  "${rollback_state[3]}" != "${latest[3]}" ]]; then
                  echo "A foreign Firebase release appeared after an ambiguous rollback response." >&2
                  exit 1
                fi
