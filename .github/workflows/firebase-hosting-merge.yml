          }

          mapfile -t latest < <(read_live_state)
          if [[ "${#latest[@]}" -ne 4 ]]; then
            echo "Could not establish rollback ownership." >&2
            exit 1
          fi

          rollback_release_name=""
          rollback_marker="rollback/$DEPLOY_MARKER"
          rollback_payload="$(jq -cn --arg message "$rollback_marker" '{message: $message}')"
          rollback_response="$RUNNER_TEMP/firebase-rollback-response.json"

          send_rollback() {
            rollback_http_code="$(curl --silent --show-error --max-time 60 \
              --proto '=https' --tlsv1.2 \
              --request POST \
              --header "Authorization: Bearer $FIREBASE_ACCESS_TOKEN" \
              --header "x-goog-user-project: $FIREBASE_PROJECT_ID" \
              --header 'Content-Type: application/json' \
              --data "$rollback_payload" \
              --output "$rollback_response" --write-out '%{http_code}' \
              "https://firebasehosting.googleapis.com/v1beta1/sites/${FIREBASE_SITE_ID}/channels/live/releases?versionName=${PREVIOUS_VERSION_NAME}" || true)"
          }

          parse_rollback_response() {
            python3 - "$rollback_response" "$FIREBASE_SITE_ID" "$PREVIOUS_VERSION_NAME" "$rollback_marker" <<'PY'
          import json
          import re
          import sys

          release = json.load(open(sys.argv[1], encoding="utf-8"))
          site = re.escape(sys.argv[2])
          expected_version = sys.argv[3]
          marker = sys.argv[4]
          name = release.get("name")
          if not isinstance(name, str) or not re.fullmatch(
              rf"sites/{site}/channels/live/releases/[0-9]+", name
          ):
              raise SystemExit("Rollback returned a malformed release name.")
          if release.get("type") not in ("DEPLOY", "ROLLBACK") or release.get("message") != marker:
              raise SystemExit("Rollback response identity is incorrect.")
          version = release.get("version")
          if (
              not isinstance(version, dict)
              or version.get("name") != expected_version
              or version.get("status") != "FINALIZED"
          ):
              raise SystemExit("Rollback response does not bind the previous version.")
          print(name)
          PY
          }

          rollback_is_transient() {
            [[ "$rollback_http_code" == "000" || "$rollback_http_code" == "408" || \
              "$rollback_http_code" == "425" || "$rollback_http_code" == "429" || \
              "$rollback_http_code" =~ ^5[0-9][0-9]$ ]]
          }

          if [[ "${latest[0]}" == "$PREVIOUS_VERSION_NAME" ]]; then
            echo "Firebase never moved away from the previous version; no rollback write is needed."
          elif [[ "${latest[1]}" == "$DEPLOY_MARKER" && "${latest[0]}" == "$PROMOTED_VERSION_NAME" ]] && \
            [[ -z "$PROMOTED_RELEASE_NAME" || "${latest[3]}" == "$PROMOTED_RELEASE_NAME" ]]; then
            send_rollback
            if [[ "$rollback_http_code" == "200" ]]; then
