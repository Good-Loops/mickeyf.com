            echo "Refusing to overwrite a Firebase release not owned by this workflow run." >&2
            exit 1
          fi

          restored="false"
          for attempt in $(seq 1 12); do
            mapfile -t restored_release < <(read_live_state)
            if [[ "${#restored_release[@]}" -ne 4 ]]; then
              echo "Could not parse the restored Firebase release." >&2
              exit 1
            fi
            if [[ "${restored_release[0]}" == "$PREVIOUS_VERSION_NAME" ]] && \
              { [[ -z "$rollback_release_name" ]] || [[ "${restored_release[3]}" == "$rollback_release_name" && "${restored_release[1]}" == "$rollback_marker" ]]; }; then
              restored="true"
              break
            fi
            sleep 5
          done
          if [[ "$restored" != "true" ]]; then
            echo "Firebase did not return to the captured previous version." >&2
            exit 1
          fi

          restored_body="$RUNNER_TEMP/firebase-live-restored.html"
          for attempt in $(seq 1 12); do
            code="$(curl --silent --show-error --max-time 10 --connect-timeout 5 \
              --proto '=https' --tlsv1.2 --max-redirs 0 \
              --output "$restored_body" --write-out '%{http_code}' \
              "https://mickeyf.com/?rollback=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" || true)"
            if [[ "$code" == "200" ]] && [[ "$(sha256sum "$restored_body" | awk '{print $1}')" == "$PREVIOUS_INDEX_SHA256" ]]; then
              echo "Previous Firebase release restored and verified."
              exit 0
            fi
            sleep 5
          done
          echo "Firebase release pointer rolled back, but the public response did not converge." >&2
          exit 1

      - name: Delete temporary preview channel
        if: ${{ always() && steps.auth.outcome == 'success' && steps.preview.outputs.cleanup-authorized == 'true' }}
        continue-on-error: true
        env:
          FIREBASE_ACCESS_TOKEN: ${{ steps.promotion-auth.outputs.access_token || steps.auth.outputs.access_token }}
        run: |
          set -euo pipefail

          if [[ ! "$PREVIEW_CHANNEL" =~ ^gha-[1-9][0-9]*-[1-9][0-9]*$ || "$PREVIEW_CHANNEL" == "live" ]]; then
            echo "Refusing to delete a non-canonical preview channel." >&2
            exit 1
          fi

          preview_api="https://firebasehosting.googleapis.com/v1beta1/sites/${FIREBASE_SITE_ID}/channels/${PREVIEW_CHANNEL}"
          response="$RUNNER_TEMP/firebase-preview-delete.json"
          code="$(curl --silent --show-error --max-time 30 \
            --proto '=https' --tlsv1.2 \
            --request DELETE \
            --header "Authorization: Bearer $FIREBASE_ACCESS_TOKEN" \
            --header "x-goog-user-project: $FIREBASE_PROJECT_ID" \
            --output "$response" --write-out '%{http_code}' \
            "$preview_api" || true)"
          if [[ "$code" != "200" && "$code" != "204" && "$code" != "404" ]]; then
            echo "Temporary Firebase preview deletion failed; its one-hour expiry remains active." >&2
            exit 1
          fi

          for attempt in $(seq 1 6); do
            code="$(curl --silent --show-error --max-time 10 \
              --proto '=https' --tlsv1.2 \
              --header "Authorization: Bearer $FIREBASE_ACCESS_TOKEN" \
              --header "x-goog-user-project: $FIREBASE_PROJECT_ID" \
              --output "$response" --write-out '%{http_code}' \
              "$preview_api" || true)"
            if [[ "$code" == "404" ]]; then
              echo "Temporary Firebase preview channel removed."
              exit 0
            fi
            if [[ "$code" != "200" ]]; then
              echo "Temporary Firebase preview cleanup could not be confirmed." >&2
              exit 1
            fi
            sleep 5
          done
          echo "Temporary Firebase preview cleanup did not converge before timeout." >&2
          exit 1

  notify:
    needs:
      - build
      - build_and_deploy
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Notify Slack (result)
        continue-on-error: true
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_RESULT: ${{ needs.build_and_deploy.result }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          set -euo pipefail

          if [[ -z "${SLACK_WEBHOOK_URL:-}" ]]; then
            echo "Slack notification skipped because no webhook is configured."
            exit 0
          fi

          if [[ "$BUILD_RESULT" == "success" && "$DEPLOY_RESULT" == "success" ]]; then
            message="Frontend deployed to Firebase Hosting. Commit: ${GITHUB_SHA:0:7}"
          else
            message="Frontend deploy failed. Commit: ${GITHUB_SHA:0:7}. Check GitHub Actions logs."
          fi

          payload="$(jq -cn --arg text "$message" '{text: $text}')"
          curl --fail --silent --show-error --retry 3 --max-time 15 \
            --proto '=https' --tlsv1.2 \
            --request POST \
            --header 'Content-Type: application/json' \
            --data "$payload" \
            "$SLACK_WEBHOOK_URL"
