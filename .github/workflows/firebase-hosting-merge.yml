              --proto '=https' --tlsv1.2 \
              --header "Authorization: Bearer $FIREBASE_ACCESS_TOKEN" \
              --header "x-goog-user-project: $FIREBASE_PROJECT_ID" \
              --output "$release_file" \
              "https://firebasehosting.googleapis.com/v1beta1/sites/${FIREBASE_SITE_ID}/channels/live"
            python3 - "$release_file" "$FIREBASE_SITE_ID" <<'PY'
          import json
          import re
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              body = json.load(handle)
          raw_site = sys.argv[2]
          site = re.escape(raw_site)
          if body.get("name") != f"sites/{raw_site}/channels/live":
              raise SystemExit("Firebase returned a foreign live channel.")
          if body.get("url") != f"https://{raw_site}.web.app":
              raise SystemExit("Firebase live-channel URL is unexpected.")
          release = body.get("release")
          if not isinstance(release, dict):
              raise SystemExit("Latest live release is missing before rollback.")
          release_name = release.get("name")
          release_type = release.get("type")
          release_time = release.get("releaseTime")
          if not isinstance(release_name, str) or not re.fullmatch(
              rf"sites/{site}/channels/live/releases/[0-9]+", release_name
          ):
              raise SystemExit("Latest release name is malformed before rollback.")
          if release_type not in ("DEPLOY", "ROLLBACK"):
              raise SystemExit("Latest release type is unexpected before rollback.")
          if not isinstance(release_time, str) or not re.fullmatch(
              r"[0-9]{4}-[0-9]{2}-[0-9]{2}T[^\n]+Z", release_time
          ):
              raise SystemExit("Latest release time is malformed before rollback.")
          version = release.get("version")
          if not isinstance(version, dict) or version.get("status") != "FINALIZED":
              raise SystemExit("Latest release version is malformed.")
          name = version.get("name")
          message = release.get("message")
