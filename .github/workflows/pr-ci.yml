name: Pull request checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web audit, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      NPM_CONFIG_FUND: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.3
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
            backend/package-lock.json
            .github/firebase-deploy/package-lock.json

      - name: Use project npm version
        run: npm install --global npm@11.6.2 --no-audit --no-fund

      - name: Install locked dependencies
        run: |
          npm ci --no-audit
          npm --prefix frontend ci --no-audit
          npm --prefix backend ci --no-audit
          npm --prefix .github/firebase-deploy ci --ignore-scripts --no-audit --no-fund

      - name: Validate Firebase deploy dependency tree
        run: |
          npm --prefix .github/firebase-deploy ls --omit=dev
          node --test .github/firebase-deploy/csv-parse-compat.test.mjs .github/firebase-deploy/basic-ftp-compat.test.mjs

      - name: Audit npm dependencies
        run: |
          npm audit --audit-level=low
          npm --prefix frontend audit --audit-level=low
          npm --prefix backend audit --audit-level=low
          npm --prefix .github/firebase-deploy audit --audit-level=high --omit=dev

      - name: Validate packaged Three Bosses WebGL release
        run: npm run three-bosses:webgl:release:validate

      - name: Type-check and build frontend
        env:
          VITE_ENABLE_THREE_BOSSES_RELEASE: "1"
        run: |
          npm --prefix frontend test
          npm --prefix frontend run build

      - name: Reject development-only Three Bosses UI from release bundle
        run: |
          if grep -R -F -n -- "Local WebGL playability prototype" frontend/dist/index.html frontend/dist/assets; then
            echo "The release bundle contains the development-only Three Bosses notice." >&2
            exit 1
          fi
          if grep -R -F -n -- "/__local/three-bosses/" frontend/dist/index.html frontend/dist/assets; then
            echo "The release bundle contains the local Three Bosses asset path." >&2
            exit 1
          fi

      - name: Test local WebGL tooling
        run: |
          npm run test:three-bosses-webgl-build
          npm run test:three-bosses-webgl-package
          npm run test:three-bosses-webgl-server
          npm run test:three-bosses-webgl-hosting
          npm --prefix .github/firebase-deploy run test:three-bosses-webgl-smoke

      - name: Validate isolated backend candidate build
        run: |
          npm run test:cloudbuild-candidate
          npm run test:frozen-backend
          npm run test:receipt-cleanup

      - name: Test backend development and migration launchers
        run: node --test backend/scripts/dev-isolated.test.cjs backend/scripts/run-migration-tests.test.mjs

      - name: Test and build backend
        run: |
          npm --prefix backend test
          npm --prefix backend run test:unit
          npm --prefix backend run test:migrations
          npm --prefix backend run prod

      - name: Test documentation watcher scheduling
        run: node --test scripts/watch-docs.test.mjs

      - name: Build documentation
        run: npm run docs

  unity-static:
    name: Unity source integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test Unity source integrity checker
        run: python3 -B -m unittest discover -s .github/scripts -p test_check_unity_project.py

      - name: Check Unity source integrity
        run: python3 .github/scripts/check-unity-project.py
