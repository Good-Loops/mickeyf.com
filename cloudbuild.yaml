# Stage A: build and publish one immutable backend image with verified provenance.
# Deployment is deliberately handled by the separate, source-less Stage B trigger.
steps:
  - id: 'Build backend image'
    name: 'gcr.io/cloud-builders/docker:latest@sha256:661e95acd923514f71f47ce7b390e06a8d31b15febecf772e506babf62960528'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/${_GCP_PROJECT_ID}/${_REPO_NAME}/${_REPO_NAME}:$COMMIT_SHA'
      - '.'
    dir: '.'

# Using the top-level images field makes Cloud Build perform the push, record the
# immutable digest in results.images, and generate provenance for that artifact.
images:
  - 'us-central1-docker.pkg.dev/${_GCP_PROJECT_ID}/${_REPO_NAME}/${_REPO_NAME}:$COMMIT_SHA'

substitutions:
  _GCP_PROJECT_ID: 'noted-reef-387021'
  _REPO_NAME: 'cloud-run-source-deploy'

serviceAccount: 'projects/noted-reef-387021/serviceAccounts/cloud-build@noted-reef-387021.iam.gserviceaccount.com'

options:
  logging: 'CLOUD_LOGGING_ONLY'
  requestedVerifyOption: 'VERIFIED'
  pubsubTopic: 'projects/noted-reef-387021/topics/mickeyf-backend-stage-a-status'
