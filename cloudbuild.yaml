steps:
  # Build the Docker image for the backend.
  - id: 'Build backend image'
    name: 'gcr.io/cloud-builders/docker:latest@sha256:661e95acd923514f71f47ce7b390e06a8d31b15febecf772e506babf62960528'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/${_GCP_PROJECT_ID}/${_REPO_NAME}/${_REPO_NAME}:$SHORT_SHA'
      - '.'
    dir: '.'

  # Push the Docker image to Google Artifact Registry.
  - id: 'Push backend image'
    name: 'gcr.io/cloud-builders/docker:latest@sha256:661e95acd923514f71f47ce7b390e06a8d31b15febecf772e506babf62960528'
    args:
      - 'push'
      - 'us-central1-docker.pkg.dev/${_GCP_PROJECT_ID}/${_REPO_NAME}/${_REPO_NAME}:$SHORT_SHA'

  # Deploy the image to Cloud Run.
  # DB_PASS and SESSION_SECRET are referenced directly from Secret Manager by
  # Cloud Run, so their plaintext values never need to enter the build step.
  - id: 'Deploy backend'
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:alpine@sha256:de1a989b158694a614852e7b53673097da3bdb394b8186d6102386b7a10d73c7'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--project'
      - '${_GCP_PROJECT_ID}'
      - '--image'
      - 'us-central1-docker.pkg.dev/${_GCP_PROJECT_ID}/${_REPO_NAME}/${_REPO_NAME}:$SHORT_SHA'
      - '--service-account'
      - '${_RUNTIME_SERVICE_ACCOUNT}'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'
      - '--add-cloudsql-instances'
      - '${_CLOUD_SQL_CONNECTION_NAME}'
      - '--update-env-vars'
      - 'NODE_ENV=production,CLOUD_SQL_CONNECTION_NAME=${_CLOUD_SQL_CONNECTION_NAME},DB_USER=${_DB_USER},DB_NAME=${_DB_NAME}'
      - '--update-secrets'
      - 'DB_PASS=DB_PASS:${_DB_PASS_SECRET_VERSION},SESSION_SECRET=SESSION_SECRET:${_SESSION_SECRET_VERSION}'
      - '--no-traffic'
      - '--tag'
      - '${_CANDIDATE_TAG}'
      - '--quiet'

  # Notify Slack after a successful deployment.
  - id: 'Notify Slack'
    name: 'gcr.io/cloud-builders/curl:latest@sha256:62ac4efe39d7ce5fe6ec104e75d6b3c369e52f8f622718fb846abde54e1cf714'
    entrypoint: 'bash'
    args:
      - '-lc'
      - |
        set -euo pipefail
        payload=$$(printf '{"text":"✅ Backend candidate deployed to Cloud Run with zero traffic. Commit: %s"}' "$COMMIT_SHA")
        curl -fsS -X POST \
          -H 'Content-type: application/json' \
          --data-raw "$$payload" \
          "$$SLACK_WEBHOOK_URL"
    secretEnv:
      - 'SLACK_WEBHOOK_URL'

availableSecrets:
  secretManager:
    - versionName: 'projects/${_GCP_PROJECT_ID}/secrets/SLACK_WEBHOOK_URL/versions/latest'
      env: 'SLACK_WEBHOOK_URL'

substitutions:
  _GCP_PROJECT_ID: 'noted-reef-387021'
  _REPO_NAME: 'cloud-run-source-deploy'
  _SERVICE_NAME: 'mickeyf-org'
  _REGION: 'us-central1'
  _RUNTIME_SERVICE_ACCOUNT: 'mickeyf-runtime@noted-reef-387021.iam.gserviceaccount.com'
  _CANDIDATE_TAG: 'phase10-candidate'
  _CLOUD_SQL_CONNECTION_NAME: 'noted-reef-387021:us-central1:cms-mickeyf'
  _DB_USER: 'cms_mickeyf'
  _DB_NAME: 'cms'
  # Rotate by adding a new enabled version, reviewing these numbers, and then
  # deploying. Numeric references make the deployed configuration repeatable.
  _DB_PASS_SECRET_VERSION: '1'
  _SESSION_SECRET_VERSION: '1'

options:
  logging: 'CLOUD_LOGGING_ONLY'
