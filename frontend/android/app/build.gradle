apply plugin: 'com.android.application'

dependencyLocking { lockAllConfigurations() }

android {
    namespace = "com.mickeyf.app"
    compileSdk = rootProject.ext.compileSdkVersion
    buildFeatures { buildConfig = true }
    defaultConfig {
        applicationId "com.mickeyf.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 6
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField "String", "LUDOLUME_STAGING_HOST", '""'
        buildConfigField "boolean", "LUDOLUME_STAGING", "false"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        if (providers.gradleProperty("ludolumeStagingHost").isPresent()) staging {
            initWith debug
            matchingFallbacks = ['debug']
            applicationIdSuffix ".staging"
            versionNameSuffix "-staging"
            def host = providers.gradleProperty("ludolumeStagingHost").orElse("").get()
            if (!(host ==~ /[a-z0-9](?:[a-z0-9-]*[a-z0-9])?(?:\.[a-z0-9](?:[a-z0-9-]*[a-z0-9])?)*\.(?:a\.run\.app|trycloudflare\.com)/) || host == "mickeyf-org-j7yuum4tiq-uc.a.run.app") {
                throw new GradleException("Staging requires a non-production Cloud Run or Quick Tunnel hostname")
            }
            buildConfigField "String", "LUDOLUME_STAGING_HOST", '"' + host + '"'
            buildConfigField "boolean", "LUDOLUME_STAGING", "true"
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation 'androidx.credentials:credentials:1.6.0'
    implementation 'androidx.browser:browser:1.10.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.6.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.2.0'
    implementation 'com.google.android.play:age-signals:0.0.4'
    implementation 'com.squareup.okhttp3:okhttp:5.4.0'
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

// A native release without its API origin can build successfully but cannot sign in.
// Check the actual synced web assets, not the environment of a later Gradle process.
tasks.register('verifyReleaseApiOrigin') {
    doLast {
        def bundles = fileTree('src/main/assets/public/assets') { include 'index-*.js' }.files
        def expected = 'productionUrl:"https://mickeyf-org-j7yuum4tiq-uc.a.run.app"'
        if (bundles.size() != 1 || !bundles.first().getText('UTF-8').contains(expected)) {
            throw new GradleException('Android release assets are missing the production API origin. Rebuild the web assets with the approved release configuration and sync Capacitor.')
        }
    }
}
tasks.matching { it.name == 'preReleaseBuild' }.configureEach { dependsOn('verifyReleaseApiOrigin') }

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
